version: '3.8'

services:
  app:
    image: node:18-alpine
    container_name: janjez-socio
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm start"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ZEPTOMAIL_URL=${ZEPTOMAIL_URL:-api.zeptomail.com}
      - ZEPTOMAIL_SENDMAIL_TOKEN=${ZEPTOMAIL_SENDMAIL_TOKEN}
      - ZEPTOMAIL_FROM_EMAIL=${ZEPTOMAIL_FROM_EMAIL}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE}
      - MPESA_ENV=${MPESA_ENV:-production}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
    volumes:
      - ./:/app
      - janjez_node_modules:/app/node_modules
      - janjez_next:/app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: janjez-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  janjez_node_modules:
  janjez_next:
