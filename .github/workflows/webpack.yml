name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "*/5 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Test
      run: npm run test:run
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SMM_API_URL: ${{ secrets.SMM_API_URL }}
        SMM_API_KEY: ${{ secrets.SMM_API_KEY }}
        SMM_FULFILLMENT_ENABLED: ${{ secrets.SMM_FULFILLMENT_ENABLED }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        ZEPTOMAIL_URL: ${{ secrets.ZEPTOMAIL_URL }}
        ZEPTOMAIL_SENDMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_SENDMAIL_TOKEN }}
        ZEPTOMAIL_FROM_EMAIL: ${{ secrets.ZEPTOMAIL_FROM_EMAIL }}
        MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
        MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
        MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
        MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
        MPESA_ENV: ${{ secrets.MPESA_ENV }}
        SMM_API_URL: ${{ secrets.SMM_API_URL }}
        SMM_API_KEY: ${{ secrets.SMM_API_KEY }}
        SMM_FULFILLMENT_ENABLED: ${{ secrets.SMM_FULFILLMENT_ENABLED }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  sync:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger SMM status sync
        run: |
          curl -X POST "${{ secrets.DEPLOY_URL }}/api/cron/smm-sync" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
